[project]
name = "agent-traffic-monitor"
version = "0.1.0"
description = "Monitors for coding-agent traffic (Claude Code, Codex, Cursor): rules + local LLM judge, evaluated on labelled synthetic attacks and real traffic."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
monitor = "monitor.cli:main"

[project.optional-dependencies]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
